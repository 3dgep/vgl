name: CI

# Pushes to main run a quick check: formatting and sources, Linux GCC with every test including
# the OpenGL checks on Mesa, and Windows MSVC. Pull requests, manual runs (gh workflow run CI)
# and a weekly run build everything: every preset, macOS, Android, iOS, WebAssembly, the baker and
# clang-tidy. macOS minutes cost ten times Linux minutes, and Windows twice.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1" # Mondays at 04:00 UTC.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format-18

      - name: Check formatting
        run: |
          git ls-files '*.c' '*.h' '*.cpp' '*.hpp' '*.inl' \
            | xargs --no-run-if-empty clang-format-18 --dry-run --Werror

      - name: Check license headers and writing style
        run: tools/ci/check-sources.sh

  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check Signed-off-by on every commit
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            author=$(git log -1 --format='%an <%ae>' "$sha")
            if ! git log -1 --format='%B' "$sha" | grep -qF "Signed-off-by: $author"; then
              echo "::error::Commit $sha has no 'Signed-off-by: $author' line. Use git commit -s."
              status=1
            fi
          done
          exit $status

  build:
    name: ${{ matrix.name }}
    if: github.event_name != 'push'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Each entry names a configure preset and a configuration from CMakePresets.json.
        # The workflow preset is <preset>-<debug|release>.
        include:
          - { name: "Windows MSVC static Release", os: windows-2025, preset: windows-msvc-static,   config: Release, workflow: windows-msvc-static-release }
          - { name: "Windows MSVC shared Debug",   os: windows-2025, preset: windows-msvc-shared,   config: Debug,   workflow: windows-msvc-shared-debug }
          - { name: "Windows MSVC no exceptions",  os: windows-2025, preset: windows-msvc-noexcept, config: Release, workflow: windows-msvc-noexcept-release }
          - { name: "Linux GCC static Debug",      os: ubuntu-24.04, preset: linux-gcc-static,      config: Debug,   workflow: linux-gcc-static-debug }
          - { name: "Linux GCC shared Release",    os: ubuntu-24.04, preset: linux-gcc-shared,      config: Release, workflow: linux-gcc-shared-release }
          - { name: "Linux Clang shared Debug",    os: ubuntu-24.04, preset: linux-clang-shared,    config: Debug,   workflow: linux-clang-shared-debug }
          - { name: "Linux Clang no exceptions",   os: ubuntu-24.04, preset: linux-clang-noexcept,  config: Release, workflow: linux-clang-noexcept-release }
    steps:
      - uses: actions/checkout@v5

      # Linux uses the installed Zstandard; Windows downloads and compiles it in, so both
      # paths of cmake/vgl_dependencies.cmake are built. The OpenGL samples download GLFW,
      # which needs the X11 and Wayland headers.
      - name: Install Ninja, Zstandard and GLFW's dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libzstd-dev libcurl4-openssl-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libwayland-dev libxkbcommon-dev

      - name: Configure, build and test
        run: cmake --workflow --preset ${{ matrix.workflow }}

      - name: Install
        run: cmake --install build/${{ matrix.preset }} --config ${{ matrix.config }} --prefix install

      - name: Build and run against the installed CMake package
        shell: bash
        run: |
          generator=()
          if [ "$RUNNER_OS" = "Linux" ]; then
            generator=(-G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.config }})
          fi
          cmake -S tests/install -B build-consumer "${generator[@]}"             -DCMAKE_PREFIX_PATH="$PWD/install"
          cmake --build build-consumer --config ${{ matrix.config }}
          ctest --test-dir build-consumer -C ${{ matrix.config }} --output-on-failure

      - name: Check the installed pkg-config file
        if: runner.os == 'Linux'
        run: |
          export PKG_CONFIG_PATH="$PWD/install/lib/pkgconfig"
          pkg-config --validate vgl
          cc tests/api_c.c $(pkg-config --static --cflags --libs vgl) -o api_c_pkgconfig
          LD_LIBRARY_PATH="$PWD/install/lib" ./api_c_pkgconfig

  # Every test, with the OpenGL samples' checks, which draw the sample data with every depth
  # convention and check the images and the host's state: on OpenGL and OpenGL ES (design
  # document, section 7.6), with Mesa's software renderer under a virtual X server.
  opengl:
    name: Linux GCC with OpenGL and OpenGL ES (Mesa, Xvfb)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libzstd-dev libcurl4-openssl-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libwayland-dev libxkbcommon-dev \
            xvfb libgl1-mesa-dri libglx-mesa0 libegl-mesa0

      - name: Configure and build
        run: |
          cmake --preset linux-gcc-shared -DVGL_TEST_GL=ON
          cmake --build --preset linux-gcc-shared-release

      - name: Run the tests and the OpenGL checks
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a ctest --test-dir build/linux-gcc-shared -C Release --output-on-failure

      # The reference server (tools/server, docs/hosting.md): Caddy at a pinned version and
      # checksum, serving the sample packs to the headless sample over HTTP.
      - name: Check the reference server
        env:
          CADDY_VERSION: 2.11.7
          CADDY_SHA512: a7a433a1b133efc3c8d10eb0b99d52a24b5ef5c322dc77f5282182b1c0402139ab83f3a99f0c52409df77d20123fb0b523edad8a66d8f5e49136197bf61ef0e7
        run: |
          mkdir -p "$RUNNER_TEMP/caddy"
          cd "$RUNNER_TEMP/caddy"
          curl -fsSLO "https://github.com/caddyserver/caddy/releases/download/v$CADDY_VERSION/caddy_${CADDY_VERSION}_linux_amd64.tar.gz"
          echo "$CADDY_SHA512  caddy_${CADDY_VERSION}_linux_amd64.tar.gz" | sha512sum -c -
          tar -xzf "caddy_${CADDY_VERSION}_linux_amd64.tar.gz" caddy
          cd "$GITHUB_WORKSPACE"
          bash tools/server/check.sh "$RUNNER_TEMP/caddy/caddy" build/linux-gcc-shared/bin/Release/vgl-headless

  # The Ogre backend and its sample's check on Ogre's OpenGL 3+ render system, with Ogre 14
  # downloaded and built statically (design document, section 7.6), under Mesa and Xvfb as the
  # OpenGL checks. Not on pushes: building Ogre takes a while.
  ogre-linux:
    name: Ogre backend (Linux GCC, OpenGL 3+, Mesa, Xvfb)
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libzstd-dev libcurl4-openssl-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libwayland-dev libxkbcommon-dev libgl-dev xvfb libgl1-mesa-dri libglx-mesa0 libegl-mesa0

      - name: Configure and build
        run: |
          cmake --preset linux-gcc-shared -DVGL_BACKEND_OGRE=ON -DVGL_TEST_GL=ON
          cmake --build --preset linux-gcc-shared-release --target vgl_ogre_sample

      - name: Run the Ogre sample's check
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a ctest --test-dir build/linux-gcc-shared -C Release -R ogre --output-on-failure

  # Windows on pushes, where the full set of presets does not run.
  windows-quick:
    name: Windows MSVC shared Debug
    if: github.event_name == 'push'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5

      - name: Configure, build and test
        run: cmake --workflow --preset windows-msvc-shared-debug

  macos:
    name: ${{ matrix.name }}
    if: github.event_name != 'push'
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "macOS Apple Clang static Release", workflow: macos-clang-static-release }
          - { name: "macOS Apple Clang shared Debug",   workflow: macos-clang-shared-debug }
    steps:
      - uses: actions/checkout@v5

      - name: Install Ninja
        run: brew install ninja

      - name: Configure, build and test
        run: cmake --workflow --preset ${{ matrix.workflow }}

  android:
    name: Android arm64 (cross-build)
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # The NDK version is pinned; the runner's SDK manager installs it.
      - name: Install Ninja and the Android NDK
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018" > /dev/null
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      # The tests are built for Android but not run: that needs an emulator.
      - name: Configure and build
        run: cmake --workflow --preset android-arm64-release

  ios:
    name: iOS arm64 (cross-build)
    if: github.event_name != 'push'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Install Ninja
        run: brew install ninja

      # The tests are built for iOS but not run: that needs a simulator build.
      - name: Configure and build
        run: cmake --workflow --preset ios-arm64-release

  # WebAssembly with Emscripten at a pinned version, with threads: the library, the samples and
  # the OpenGL sample's page, and the tests and the headless check on Node.js (design document,
  # section 4). The page's check opens it in the runner's Chrome, served by Caddy at a pinned
  # version and checksum, and flies it to the Sognefjord (tests/browser/page_check.mjs).
  web:
    name: WebAssembly (Emscripten, Node.js, Chrome)
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    env:
      EMSDK_VERSION: 6.0.11
      CADDY_VERSION: 2.11.7
      CADDY_SHA512: a7a433a1b133efc3c8d10eb0b99d52a24b5ef5c322dc77f5282182b1c0402139ab83f3a99f0c52409df77d20123fb0b523edad8a66d8f5e49136197bf61ef0e7
    steps:
      - uses: actions/checkout@v5

      - name: Install Ninja, Emscripten and Caddy
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build
          git clone --depth 1 --branch "$EMSDK_VERSION" https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install "$EMSDK_VERSION"
          "$RUNNER_TEMP/emsdk/emsdk" activate "$EMSDK_VERSION"
          echo "EMSDK=$RUNNER_TEMP/emsdk" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/caddy"
          cd "$RUNNER_TEMP/caddy"
          curl -fsSLO "https://github.com/caddyserver/caddy/releases/download/v$CADDY_VERSION/caddy_${CADDY_VERSION}_linux_amd64.tar.gz"
          echo "$CADDY_SHA512  caddy_${CADDY_VERSION}_linux_amd64.tar.gz" | sha512sum -c -
          tar -xzf "caddy_${CADDY_VERSION}_linux_amd64.tar.gz" caddy

      - name: Configure, build and test
        run: |
          source "$EMSDK/emsdk_env.sh"
          cmake --preset emscripten -DVGL_TEST_BROWSER=ON -DVGL_CADDY="$RUNNER_TEMP/caddy/caddy"
          cmake --build --preset emscripten-release
          ctest --preset emscripten-release

      - name: Keep the page's screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-check
          path: build/emscripten/samples/gl/browser-check.png
          if-no-files-found: ignore

  baker-linux:
    name: Baker (Linux, system GDAL)
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libzstd-dev libcurl4-openssl-dev libgdal-dev nlohmann-json3-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libwayland-dev libxkbcommon-dev

      - name: Configure, build and test
        run: cmake --workflow --preset linux-gcc-baker-release

  baker-windows:
    name: Baker (Windows, conda-forge GDAL)
    if: github.event_name != 'push'
    runs-on: windows-2025
    defaults:
      run:
        # A login shell, so that the micromamba environment is active and CONDA_PREFIX is set.
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v5

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: tools/baker/environment.yml
          init-shell: bash
          cache-environment: true

      - name: Configure, build and test
        run: cmake --workflow --preset windows-msvc-baker-release

  clang-tidy:
    name: clang-tidy
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 clang-tidy-18 ninja-build libzstd-dev libcurl4-openssl-dev libgdal-dev \
            nlohmann-json3-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libwayland-dev libxkbcommon-dev

      - name: Configure and build
        # The preset exports compile_commands.json. Pin the compiler to match clang-tidy-18.
        run: |
          cmake --preset linux-clang-static -DVGL_BUILD_BAKER=ON -DVGL_DEFAULTS_HTTP=ON \
            -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18
          cmake --build --preset linux-clang-static-debug

      - name: Run clang-tidy
        run: |
          test -f build/linux-clang-static/compile_commands.json
          # stb_image.c only configures and compiles the third-party stb_image.h.
          run-clang-tidy-18 -p build/linux-clang-static -quiet \
            "$PWD/(src|backends|tools)/(?!decoders/stb_image\.c)"
