name: Feature request
description: Suggest a new feature or an improvement.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        vgl is deliberately small. Please check the goals and non-goals in the README and
        docs/design.md before proposing a feature.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and why is it hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you like vgl to solve it? Include API sketches if you have them.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches, including solving it outside vgl through an extension point.
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - C API or C++ wrapper
        - Geodesy
        - Tiling and selection
        - Cache and residency
        - Data providers
        - Decoders
        - Mesh builder
        - Render interface or backends
        - Baking tool
        - Pack format
        - Build and packaging
        - Documentation
